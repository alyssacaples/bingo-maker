<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- A bingo card at 32px: paper, ink rules, one dauber mark on the free space.
       Deliberately only 3x3 — a 5x5 grid turns to mush at favicon size.
       Built from filled rects rather than strokes so it rasterizes anywhere. -->
  <rect width="32" height="32" fill="#16150F"/>
  <rect x="2.5" y="2.5" width="27" height="27" fill="#FBF8EE"/>
  <rect x="11.4" y="11.4" width="9.2" height="9.2" fill="#F1C43F"/>
  <rect x="11.4" y="2.5" width="1.2" height="27" fill="#16150F"/>
  <rect x="19.4" y="2.5" width="1.2" height="27" fill="#16150F"/>
  <rect x="2.5" y="11.4" width="27" height="1.2" fill="#16150F"/>
  <rect x="2.5" y="19.4" width="27" height="1.2" fill="#16150F"/>
  <circle cx="16" cy="16" r="3.2" fill="#BA1A1A"/>
</svg>
