<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Redirect legacy ?template=<slug> URLs to their real /templates/<slug> path.
         Runs before anything else loads so it's fast and never fights React's
         own URL handling (see getTemplateSlugFromPath in src/App.jsx). -->
    <script>
      (function () {
        var slug = new URLSearchParams(window.location.search).get('template');
        if (slug && /^[a-z0-9-]+$/.test(slug)) {
          window.location.replace('/templates/' + slug);
        }
      })();
    </script>
    <!-- Theme, resolved before first paint so there's no flash of the wrong
         mode. Runs after the redirect above and before fonts/analytics.
         An absent data-theme means "follow the OS". -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) { /* Safari private mode: fall back to the media query */ }
      })();
    </script>
